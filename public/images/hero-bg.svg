<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Ambient Atmospheric Glows -->
    <radialGradient id="softCyan" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="softEmerald" cx="25%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="softIndigo" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Ultra-Fine Minimal Tech Grid -->
    <pattern id="fineGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.07"/>
      <circle cx="60" cy="0" r="1" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>

    <linearGradient id="gridFadeMaskLinear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.0"/>
      <stop offset="25%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.0"/>
    </linearGradient>

    <mask id="fineGridMask">
      <rect width="100%" height="100%" fill="url(#gridFadeMaskLinear)"/>
    </mask>

    <filter id="gentleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Base -->
  <rect width="100%" height="100%" fill="#030712"/>

  <!-- Soft Ambient Glow Orbs -->
  <circle cx="960" cy="200" r="500" fill="url(#softCyan)"/>
  <circle cx="350" cy="280" r="450" fill="url(#softEmerald)"/>
  <circle cx="1570" cy="280" r="450" fill="url(#softIndigo)"/>

  <!-- Faded Grid Floor -->
  <rect width="100%" height="100%" fill="url(#fineGrid)" mask="url(#fineGridMask)"/>

  <!-- Delicate Hairline Data Traces (Smooth, non-intrusive) -->
  <g opacity="0.35">
    <!-- Subtle smooth path -->
    <path d="M 100 240 Q 500 360 850 260 T 960 290 T 1070 260 Q 1420 360 1820 240" 
          fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.35"/>
    
    <path d="M 150 420 Q 550 320 880 390 T 960 290 T 1040 390 Q 1370 320 1770 420" 
          fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Minimal Subtle Nodes -->
    <circle cx="960" cy="290" r="4" fill="#38bdf8" filter="url(#gentleGlow)"/>
    <circle cx="960" cy="290" r="1.5" fill="#ffffff"/>

    <circle cx="450" cy="310" r="3" fill="#10b981" opacity="0.6"/>
    <circle cx="1470" cy="310" r="3" fill="#6366f1" opacity="0.6"/>

    <circle cx="750" cy="250" r="2.5" fill="#06b6d4" opacity="0.5"/>
    <circle cx="1170" cy="250" r="2.5" fill="#06b6d4" opacity="0.5"/>
  </g>

  <!-- Hairline Geometric Framing at screen edges -->
  <g stroke="#06b6d4" stroke-width="1" stroke-opacity="0.12" fill="none">
    <path d="M 80 120 L 80 80 L 120 80"/>
    <path d="M 1840 120 L 1840 80 L 1800 80"/>
  </g>
</svg>
