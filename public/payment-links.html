    .container {

    }

      align-items: center;

      font-size: 20px;
      color: #022c22;

    .brand-title h1 {

      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-title p {
      font-size: 13px;
      color: var(--muted);
    }

      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);

      color: #34d399;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

      font-size: 13px;
      font-weight: 600;

      font-weight: 800;
      color: #ffffff;

      gap: 10px;

      border-radius: 10px;

      font-size: 12.5px;
      font-weight: 700;
      font-family: inherit;

    let activeCategory = 'all';

    function renderCatalog() {
      const container = document.getElementById('catalog');
      container.innerHTML = '';

      SECTIONS.forEach((sec) => {
        if (activeCategory !== 'all' && activeCategory !== sec.id) return;

        const secEl = document.createElement('div');
        secEl.className = 'service-section';

        let cardsHtml = '';
        sec.items.forEach((item, idx) => {
          const encodedUrl = encodeURIComponent(item.url);
          const encodedMsg = encodeURIComponent(item.msg);
          cardsHtml += `
            <div class="card ${item.highlight ? 'highlight' : ''}">
              <div>
                <div class="card-top">
                  <div>
                    <span class="badge ${item.badgeClass}">${item.badge}</span>
                    <div class="plan-name">${item.name}</div>
                  </div>
                  <div class="price-box">
                    <span class="price">${item.price}</span>
                    <span class="price-unit">${item.unit}</span>
                  </div>
                </div>
                <p class="plan-desc">${item.desc}</p>
              </div>

              <div>
                <div class="url-box" style="margin-bottom: 12px;">
                  <span>${item.url}</span>
                </div>
                <div class="btn-group">
                  <button class="btn btn-primary" onclick="copyDecoded('${encodedUrl}', 'คัดลอกลิงก์ ${item.name} แล้ว!')">
                    🔗 Copy ลิงก์
                  </button>
                  <button class="btn btn-secondary" onclick="copyDecoded('${encodedMsg}', 'คัดลอกข้อความพร้อมส่ง ${item.name} แล้ว!')">
                    💬 Copy ข้อความส่งลูกค้า
                  </button>
                  <a class="btn btn-open" href="${item.url}" target="_blank" rel="noopener noreferrer">
                    ↗️ เปิดหน้าชำระเงินทดสอบในแท็บใหม่
                  </a>
                </div>
              </div>
            </div>
          `;
        });

        secEl.innerHTML = `
          <div class="section-header">
            <h2>${sec.title}</h2>
            <span class="section-tag">${sec.tag}</span>
          </div>
          <div class="grid">${cardsHtml}</div>
        `;
        container.appendChild(secEl);
      });
    }

    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      renderCatalog();
    }

    function copyDecoded(encodedText, label) {
      const text = decodeURIComponent(encodedText);
      navigator.clipboard.writeText(text).then(() => {
        showToast(label);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(label);
      });
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = '✅ ' + msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        t.classList.remove('show');
      }, 2400);
    }

    renderCatalog();
  </script>
